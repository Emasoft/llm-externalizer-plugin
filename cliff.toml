[changelog]
header = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n"
# Entries are SUBJECT-LINE ONLY: first line of `commit.raw_message`
# (unparsed, so the `type(scope):` prefix renders identically for
# conventional and unconventional commits). Full bodies used to be
# included and grew CHANGELOG.md to 15,485 lines / 764KB, and the
# full-history regen took ~16 minutes per publish (measured v13.5.8,
# TRDD-WIO13P1P). Bodies remain in git history; publish.py now runs
# git-cliff in --unreleased --prepend mode, so pre-2026-08-19 entries
# keep their old full-body format — do not regenerate them.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.raw_message | split(pat="\n") | first | upper_first | trim }}
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
# Redact private absolute paths from commit messages BEFORE they are
# rendered into CHANGELOG.md. Without this, any commit message that
# includes a developer's home-directory path (e.g. when explaining a
# fix that scrubbed such a path) would re-leak it in the published
# changelog and fail the CPV "private path leaked" check on the very
# next publish run. The replacement preserves the descriptive intent
# without retaining the private prefix.
commit_preprocessors = [
    { pattern = "/Users/[A-Za-z0-9._-]+/", replace = "<HOME>/" },
    { pattern = "/home/[A-Za-z0-9._-]+/", replace = "<HOME>/" },
    { pattern = "C:\\\\Users\\\\[A-Za-z0-9._-]+\\\\", replace = "<HOME>\\" },
]
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^doc|^docs", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactored" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore: auto-bump", skip = true },
    { message = "^chore", group = "Miscellaneous" },
    { message = "^Release v", group = "Releases", skip = true },
    { body = ".*", group = "Changed" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "newest"
