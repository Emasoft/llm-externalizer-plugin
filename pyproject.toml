[project]
name = "llm-externalizer-plugin"
version = "13.1.0"
description = "Claude Code plugin: offload bounded LLM tasks to cheaper local or remote models via the llm-ext CLI"
requires-python = ">=3.12"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Canonical CPV pipeline dev extra. `.github/workflows/release.yml` runs
# `uv sync --extra dev` and then invokes ruff / mypy / pytest from it — if this
# extra is absent the release job dies at the sync step, before any gate runs.
dev = [
    "pytest",
    "ruff",
    "mypy",
]
# cluster_synonyms embeddings sidecar (scripts/llm-ext/scripts/compute_embeddings.py).
# Heavy deps (torch via sentence-transformers, ~1GB). Install only when you
# plan to use the cluster_synonyms tool: `uv pip install -e '.[embeddings]'`.
embeddings = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 (line too long) excluded — 120 is plenty; some strings are intentionally long
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that need a real local backend",
]
