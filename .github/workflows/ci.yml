name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref instead of letting them pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, build and test
    runs-on: ubuntu-latest
    # The default ceiling is 360 min; a hung npm/vitest step would otherwise
    # burn six hours of Actions minutes before anyone noticed.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/llm-ext/package-lock.json

      # `npm ci` (not `npm install`): CI must build against the locked dep tree,
      # not whatever the registry resolves today. Mirrors publish.py's gate.
      - name: Install dependencies
        working-directory: scripts/llm-ext
        run: npm ci --ignore-scripts

      # `--ignore-scripts` above blocks every package's install hook for
      # supply-chain safety, but better-sqlite3 ships a native addon (.node)
      # that the mass-scouting tests load at runtime. Rebuilding ONLY that
      # package keeps the protection on every other dependency. The explicit
      # `--no-ignore-scripts` is mandatory — a global `ignore-scripts=true`
      # otherwise silently no-ops the rebuild and the tests then fail with
      # "Could not locate the bindings file". Mirrors publish.py::run_checks.
      - name: Rebuild native modules
        working-directory: scripts/llm-ext
        run: npm rebuild better-sqlite3 --no-ignore-scripts

      - name: Typecheck
        working-directory: scripts/llm-ext
        run: npm run typecheck

      - name: Lint
        working-directory: scripts/llm-ext
        run: npm run lint

      - name: Build
        working-directory: scripts/llm-ext
        run: npm run build

      # broker.test.ts drives a real llama-server (no mocks; a missing binary or
      # network must FAIL the test, never skip it). Pinned release + SHA-256 of the
      # asset (the release publishes it as the asset digest; verified locally by
      # downloading b11969 and hashing). A mismatch fails the step.
      - name: Install llama-server
        env:
          LLAMA_TAG: b11969
          LLAMA_SHA256: ad8b3af2ec3201cd21287e4d457356ccd486ea23410fb7f7d8238b3dd82464d6
        run: |
          set -euo pipefail
          asset="llama-${LLAMA_TAG}-bin-ubuntu-x64.tar.gz"
          dest="${RUNNER_TEMP}/llama-cpp"
          mkdir -p "$dest"
          curl -fsSL --retry 3 -o "${dest}/${asset}" \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_TAG}/${asset}"
          echo "${LLAMA_SHA256}  ${dest}/${asset}" | sha256sum -c -
          tar -xzf "${dest}/${asset}" -C "$dest"
          echo "${dest}/llama-${LLAMA_TAG}" >> "$GITHUB_PATH"
          "${dest}/llama-${LLAMA_TAG}/llama-server" --version

      # The two tiny GGUF models broker.test.ts pulls through `-hf` into
      # LLAMA_CACHE; the key is the model list so a changed list refetches.
      - name: Cache llama models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/llm-ext-llama-cache
          key: llama-models-${{ hashFiles('scripts/llm-ext/src/broker/broker.test.ts') }}
      - name: Test
        working-directory: scripts/llm-ext
        run: npm test

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Lint Python scripts
        run: uv run --no-project --with ruff ruff check scripts/

      # TRDD-CCS6ENHU: tests/*.py previously ran ONLY in release.yml, gated
      # behind an actual release — a regression here reached CI green and
      # shipped before anyone saw a failure. Mirrors release.yml's own
      # marker filter exactly so both pipelines agree on what "passing"
      # means. `--extra dev` is REQUIRED: pytest is an optional-dependency,
      # not a base [project] dependency, so a bare `uv run pytest` on a
      # clean runner with no pytest elsewhere on PATH dies with
      # "Failed to spawn: pytest — No such file or directory" (verified
      # empirically under a PATH stripped of every pre-installed pytest;
      # mirrors release.yml's `uv sync --extra dev`). `--ignore=tests/dogfood`
      # excludes the CLI harness module (no test_* functions, so it
      # contributes zero test items either way) from collection so an
      # unrelated future import there can't affect this run.
      - name: Python tests
        run: uv run --extra dev pytest tests/ --ignore=tests/dogfood -v -m "not integration and not slow"

      - name: Validate plugin manifest
        run: python3 -c "import json, pathlib; json.loads(pathlib.Path('.claude-plugin/plugin.json').read_text(encoding='utf-8'))"

      # The CLI migration (d557c68) deleted mcp-server/server.json — the MCP
      # registry manifest this step used to read. Reading a file that no longer
      # exists made the step die with FileNotFoundError on EVERY run, so CI was
      # red regardless of the code being pushed. The three version anchors that
      # actually exist now are plugin.json, scripts/llm-ext/package.json and the
      # `const VERSION` literal in scripts/llm-ext/src/cli/main.ts — the exact same
      # three publish.py rewrites and stages on release, so this check and the
      # release pipeline can no longer disagree about where the version lives.
      - name: Version consistency check
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import sys

          plugin = json.loads(
              pathlib.Path(".claude-plugin/plugin.json").read_text(encoding="utf-8")
          )["version"]
          pkg = json.loads(
              pathlib.Path("scripts/llm-ext/package.json").read_text(encoding="utf-8")
          )["version"]

          src = pathlib.Path("scripts/llm-ext/src/cli/main.ts").read_text(encoding="utf-8")
          match = re.search(r"""const VERSION = (["'`])([^"'`]+)\1""", src)
          if match is None:
              sys.exit(
                  "::error::could not find `const VERSION = \"...\"` in "
                  "scripts/llm-ext/src/cli/main.ts — the release version anchor moved"
              )
          cli = match.group(2)

          print(f"plugin.json: {plugin} | package.json: {pkg} | cli/main.ts: {cli}")
          if len({plugin, pkg, cli}) != 1:
              sys.exit("::error::Version mismatch across manifests")
          PY
