name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Least-privilege baseline. The release job widens to exactly the writes it
# needs (contents: write to create the release + upload assets; id-token +
# attestations: write for the build-provenance attestation).
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Cold-install ceiling: `uvx --from git+…` clones and builds CPV from
    # source on a COLD runner. Measured: the last 30 Release runs took 2m11s to
    # 4m36s wall time (25 green: same range; wall time = run updatedAt minus
    # createdAt, not job duration). Cold-run figure is INFERRED, not confirmed:
    # v14.1.0 ran 57 days after v13.6.0 (cache possibly evicted, not confirmed)
    # and took 3m29s. The uv cache is OFF in this job (TRDD-YLTYAQUU), so
    # EVERY run is cold and must fit under this cap. The 25 min floor is kept
    # because a worst-case cold build is not measured. Do NOT lower below 25.
    timeout-minutes: 30
    permissions:
      contents: write       # create the release + upload assets
      id-token: write       # OIDC token for the provenance attestation
      attestations: write   # write the provenance attestation
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        # TRDD-YLTYAQUU: enable-cache is false on purpose. A release job must not
        # restore a uv cache another run wrote (zizmor cache-poisoning: a poisoned
        # cache could reach the published artifacts). Cost: CPV is built cold on
        # every release (measured: 2m11s-4m36s wall time over the last 30 runs;
        # the cold-run figure is inferred, cache eviction not confirmed in the log).
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      # ── Plugin validation ───────────────────────────────────────────────
      # This re-runs, on the tag, the SAME CPV gate scripts/publish.py already
      # passed locally before it pushed. Two deliberate deviations from the
      # stock CPV template, both required for this plugin to have a truthful
      # gate rather than a permanently-red one:
      #
      #   1. NO `--strict`. publish.py's gate blocks on CRITICAL/MAJOR only.
      #      `--strict` additionally blocks MINOR/NIT, so a strict job here
      #      would fail tags that publish.py legitimately allowed — the CI
      #      verdict must match the gate that actually guards the release.
      #   2. The verdict is computed by publish.py's OWN classifier
      #      (classify_cpv_findings), so the `cpv.skillaudit_advisory` opt-in
      #      declared in plugin.json is honoured here exactly as it is locally.
      #      A raw exit-code check would ignore the opt-in and red-light every
      #      release on the known skillaudit false positives (upstream #41).
      #
      # Importing the classifier instead of re-implementing it keeps ONE
      # source of truth: if the local gate's semantics change, this job
      # follows automatically and cannot silently drift apart from it.
      #
      # CPV is PINNED to a COMMIT SHA so a stricter future CPV release cannot
      # break the release gate with no change to this plugin. A tag is
      # MOVABLE; a commit SHA is not — the SHA fixes the transport's
      # provenance by the ref itself. The SHA must be updated by hand when
      # the pin moves (upstream #243 / #256); remove the integrity bypass
      # FIRST, then update the SHA.
      - name: Run full plugin validation (remote CPV)
        env:
          # Skip the GitHub-anchored integrity fetch on a fresh-checkout runner
          # (the local manifest already matches the code).
          PLUGIN_SKIP_GITHUB_INTEGRITY: "1"
          # Cap the aggregate repo-lint wall-clock; on a cold runner the
          # ~17-linter fan-out serializes on a global uv/npm cache lock.
          PLUGIN_REPO_LINT_PHASE_TIMEOUT: "600"
        run: |
          # Both outputs go to RUNNER_TEMP, OUTSIDE the directory being scanned.
          # Writing them into '.' made the gate fail on its own scratch files: the
          # shell creates the redirect target before CPV starts, so the scan saw a
          # zero-length validation.json in the plugin root and reported it as
          # "[MAJOR] JSON syntax error ... Expecting value: line 1 column 1" — one
          # blocking finding, produced entirely by this step, on every release.
          REPORT_TXT="${RUNNER_TEMP:-/tmp}/cpv-validation-report.txt"
          REPORT_JSON="${RUNNER_TEMP:-/tmp}/cpv-validation.json"
          # The bypass note is written ONCE, here, BEFORE the text run — so the
          # clean-run path (which exits this step early) and the JSON branch
          # below both have it. The note text is the same one the local gate
          # writes into cpv.log.
          BYPASS_NOTE="${RUNNER_TEMP:-/tmp}/cpv-bypass-note.txt"
          printf '%s\n' "# CPV INTEGRITY SELF-CHECK DISABLED via PLUGIN_SKIP_GITHUB_INTEGRITY=1 — CPV's GitHub-anchored hash check was NOT run for this validation" > "$BYPASS_NOTE"
          set +e
          # v5.22.0
          uvx --from git+https://github.com/Emasoft/claude-plugins-validation@d5d6149735c4f0055bb3b83a56b28036079682ad \
              --with pyyaml \
              cpv-remote-validate plugin . > "$REPORT_TXT" 2>&1
          text_exit=$?
          set -e
          # The bypass record leads the artifact, exactly as the local gate's
          # cpv.log does — the same note text in both, so the two artifacts
          # say the same thing. The CI artifact is the one that actually
          # gated the release and it is shipped as the validation-report.txt
          # release asset, so without this the shipped evidence carries no
          # record of the disable. Prepended AFTER the text run has FINISHED
          # and BEFORE the `cp` below, so it is safe: the scan already ran
          # against the un-prefixed report and no half-written file is put
          # under the scanner. The console `cat` comes AFTER the prepend, so
          # the console log carries the note too. The NOTE FILE ITSELF is
          # created BEFORE the text run, not here: the clean-run path exits
          # this step early, so a note file created after that branch would
          # never exist on the clean path — and the JSON branch below needs
          # it too. Creating it here means BOTH branches have it.
          cat "$BYPASS_NOTE" "$REPORT_TXT" > "${REPORT_TXT}.with-note"
          mv "${REPORT_TXT}.with-note" "$REPORT_TXT"
          cat "$REPORT_TXT"
          # Publish-side copy: SHA256SUMS, the release upload and the provenance
          # attestation all expect ./validation-report.txt. Copying it back AFTER
          # the text scan has finished restores that asset without putting a
          # half-written file under the scanner — unlike validation.json, this
          # name is gitignored, so it was never the finding that failed the gate.
          cp "$REPORT_TXT" validation-report.txt
          if [ "$text_exit" -eq 0 ]; then
            echo "Validation passed (clean)"
            exit 0
          fi
          # Non-zero: re-run with --json so the findings can be classified with
          # the same rule the local gate uses.
          set +e
          # v5.22.0
          uvx --from git+https://github.com/Emasoft/claude-plugins-validation@d5d6149735c4f0055bb3b83a56b28036079682ad \
              --with pyyaml \
              cpv-remote-validate plugin . --json > "$REPORT_JSON" 2>/dev/null
          json_exit=$?
          set -e
          # The JSON report carries NO note line of its own: the classifier below
          # does json.loads() on it, so prepending a "#" comment would make it
          # unparseable and the gate would fail closed for the wrong reason.
          # The note therefore travels as a SEPARATE file, written BESIDE the
          # JSON so the two live together.
          cp "$BYPASS_NOTE" "${REPORT_JSON}.bypass-note.txt"
          if [ ! -s "$REPORT_JSON" ]; then
            echo "::error::CPV produced no --json output (exit ${json_exit}) — the validator FAILED TO RUN (infra/network/install failure), this is NOT a findings verdict. See the log above."
            exit 1
          fi
          CPV_REPORT_JSON="$REPORT_JSON" python3 - <<'PY'
          import os
          import pathlib
          import sys

          # scripts/publish.py is import-safe: everything executable lives
          # behind `if __name__ == "__main__"`.
          sys.path.insert(0, "scripts")
          from publish import (  # noqa: E402
              _format_finding,
              _read_skillaudit_advisory_optin,
              classify_cpv_findings,
          )

          raw = pathlib.Path(os.environ["CPV_REPORT_JSON"]).read_text(encoding="utf-8")
          repo_root = pathlib.Path(".")
          advisory_optin = _read_skillaudit_advisory_optin(repo_root)

          parse_ok, advisory, blocking = classify_cpv_findings(
              raw, skillaudit_advisory=advisory_optin
          )
          if not parse_ok:
              # Fail CLOSED, exactly as publish.py does: an unparseable report
              # must never be read as "no findings".
              sys.exit(
                  "::error::CPV --json output could not be parsed — failing "
                  "closed. See the validation report printed above."
              )

          for finding in advisory:
              print(f"::notice::ADVISORY (skillaudit, upstream #41) {_format_finding(finding)}")
          for finding in blocking:
              print(f"::error::{_format_finding(finding)}")

          if blocking:
              sys.exit(
                  f"::error::Validation failed — {len(blocking)} blocking "
                  "CRITICAL/MAJOR finding(s)"
              )
          print(
              f"Validation passed ({len(advisory)} skillaudit finding(s) "
              "downgraded to advisory via cpv.skillaudit_advisory)"
          )
          PY

      # TRDD-36L97JC9: tests/test_publish_failed_push.py and tests/test_publish_runs_git_in_repo_root.py run the REAL
      # git-cliff (scripts/publish.py step 4), and the ubuntu runner does not ship it: both died with FileNotFoundError.
      # Pinned release + SHA-256 of the asset (the release publishes it as the asset digest; verified by downloading
      # v2.14.2 and hashing it), the same pattern as the llama-server step in ci.yml; a mismatch fails the step. 2.14.2
      # is the version the tests pass on locally.
      - name: Install git-cliff
        env:
          CLIFF_TAG: v2.14.2
          CLIFF_SHA256: 24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4
        run: |
          set -euo pipefail
          asset="git-cliff-${CLIFF_TAG#v}-x86_64-unknown-linux-gnu.tar.gz"
          dest="${RUNNER_TEMP}/git-cliff"
          mkdir -p "$dest"
          curl -fsSL --retry 3 -o "${dest}/${asset}" \
            "https://github.com/orhun/git-cliff/releases/download/${CLIFF_TAG}/${asset}"
          echo "${CLIFF_SHA256}  ${dest}/${asset}" | sha256sum -c -
          tar -xzf "${dest}/${asset}" -C "$dest"
          echo "${dest}/git-cliff-${CLIFF_TAG#v}" >> "$GITHUB_PATH"
          "${dest}/git-cliff-${CLIFF_TAG#v}/git-cliff" --version

      # The pytest step below builds dist in a temp copy (tests/test_publish_real_build_stale_dist.py, TRDD-EWU9OAYI),
      # which needs node and the locked dependencies in scripts/llm-ext; the test itself never installs anything.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # false: a release must not restore a cache another run wrote (zizmor cache-poisoning).
          package-manager-cache: false

      # `npm ci` (not `npm install`): the build must use the locked dep tree,
      # not whatever the registry resolves today. Mirrors ci.yml and publish.py's gate.
      - name: Install Node dependencies
        working-directory: scripts/llm-ext
        run: npm ci --ignore-scripts

      - name: Run tests
        # Integration- and slow-marked tests need a live backend / API credit,
        # which a release runner has neither of; every other test must pass.
        # --ignore=tests/dogfood: a CLI harness module, not a pytest suite (no
        # test_* functions) — excluded from collection so it can't affect this
        # run even if it grows a side-effecting import later. --extra dev:
        # pytest lives only in pyproject.toml's optional dev extra, not a base
        # [project] dependency (TRDD-CCS6ENHU, bc01f2c) — keeps this
        # invocation textually identical to ci.yml's and publish.py gate 10's.
        run: uv run --extra dev pytest tests/ --ignore=tests/dogfood -v -m "not integration and not slow"

      - name: Lint Python scripts
        run: uv run ruff check scripts/

      - name: Type check
        run: uv run mypy scripts/ --ignore-missing-imports

      - name: Generate SBOM (SPDX)
        # Supply-chain control: publish an SPDX bill of materials alongside the
        # release so consumers can audit what shipped.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-release-assets: false
          upload-artifact: false

      - name: Generate changelog
        id: changelog
        # Extract ONLY the matching `## [X.Y.Z] - YYYY-MM-DD` block from
        # CHANGELOG.md — the release body should be this release's notes, not
        # the entire project history. Falls back to a git log when no section
        # (or no CHANGELOG.md) matches.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          VERSION="${TAG#v}"
          if [ -f CHANGELOG.md ]; then
            SECTION=$(awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\][ ]*[—-]" {found=1; print; next}
              found && /^## / {exit}
              found {print}
            ' CHANGELOG.md)
            if [ -n "$SECTION" ]; then
              printf '%s\n' "$SECTION" > changelog.txt
              echo "::notice::Release body extracted from CHANGELOG.md section for $VERSION"
            else
              echo "::warning::No CHANGELOG.md section matched ## [$VERSION] — falling back to git log"
              PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
              if [ -z "$PREV_TAG" ]; then
                git log --pretty=format:"- %s (%h)" HEAD > changelog.txt
              else
                git log --pretty=format:"- %s (%h)" "$PREV_TAG..HEAD" > changelog.txt
              fi
            fi
          else
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -z "$PREV_TAG" ]; then
              git log --pretty=format:"- %s (%h)" HEAD > changelog.txt
            else
              git log --pretty=format:"- %s (%h)" "$PREV_TAG..HEAD" > changelog.txt
            fi
          fi
          echo "changelog_file=changelog.txt" >> "$GITHUB_OUTPUT"

      - name: Compute per-asset SHA256SUMS
        run: |
          set -e
          : > SHA256SUMS
          for f in validation-report.txt sbom.spdx.json; do
            if [ -f "$f" ]; then
              sha256sum "$f" >> SHA256SUMS
            fi
          done
          echo "SHA256SUMS:"
          cat SHA256SUMS

      - name: Create or update GitHub Release (idempotent)
        # scripts/publish.py already creates the release locally as its last
        # step, so this job must tolerate an existing release rather than 422.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — editing in place"
            gh release edit "$TAG" --notes-file changelog.txt --verify-tag
            gh release upload "$TAG" validation-report.txt sbom.spdx.json SHA256SUMS --clobber
          else
            echo "Release $TAG does not exist yet — creating"
            gh release create "$TAG" validation-report.txt sbom.spdx.json SHA256SUMS \
              --title "$TAG" \
              --notes-file changelog.txt \
              --verify-tag
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            validation-report.txt
            sbom.spdx.json
